[package]
name = "openai-rs-client"
description = "Async OpenAI API client and transport runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["rustls-tls"]
rustls-tls = [
    "reqwest/rustls-tls",
    "tokio-tungstenite?/rustls-tls-webpki-roots",
    "dep:rustls",
    "dep:webpki-roots",
]
native-tls = [
    "reqwest/native-tls",
    "tokio-tungstenite?/native-tls",
    "dep:native-tls",
]
realtime = ["openai-rs-types/realtime", "dep:tokio-tungstenite"]
webhook-verification = ["openai-rs-types/webhooks", "dep:sha2"]
admin = ["openai-rs-types/admin"]
workload-identity = []
x509 = ["workload-identity"]

[dependencies]
async-stream.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
httpdate = "1.0.3"
native-tls = { version = "0.2.14", optional = true }
openai-rs-types = { path = "../openai-rs-types", version = "=0.1.0", default-features = false }
pin-project-lite.workspace = true
reqwest.workspace = true
rustls = { version = "0.23.43", optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"], optional = true }
url.workspace = true
webpki-roots = { version = "0.26.11", optional = true }
zeroize.workspace = true

[dev-dependencies]
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["server", "tokio"] }
static_assertions.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
