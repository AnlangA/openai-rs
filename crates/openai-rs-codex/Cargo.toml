[package]
name = "openai-rs-codex"
description = "Isolated Codex app-server integration for openai-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["app-server"]
app-server = []
access-token = ["app-server"]
experimental-direct = [
    "dep:base64",
    "dep:futures-util",
    "dep:getrandom",
    "dep:reqwest",
    "dep:ring",
    "reqwest/rustls-tls",
]
experimental-direct-device = ["experimental-direct"]
experimental-direct-keyring = ["experimental-direct", "dep:keyring"]

[dependencies]
async-trait.workspace = true
base64 = { workspace = true, optional = true }
bytes.workspace = true
futures-core.workspace = true
futures-util = { workspace = true, optional = true }
getrandom = { version = "0.3.4", optional = true }
keyring = { version = "=4.2.0", optional = true }
openai-rs-types = { path = "../openai-rs-types", version = "=0.1.1", default-features = false }
reqwest = { workspace = true, optional = true }
ring = { version = "0.17.14", optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
static_assertions.workspace = true
tempfile = "3.21.0"

[lints]
workspace = true
