[package]
name = "openai-rs-rmcp"
description = "Typed RMCP bridge for OpenAI Responses tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["client"]
client = ["rmcp/client"]
stdio = ["client", "rmcp/transport-child-process"]
http-rustls = ["client", "rmcp/transport-streamable-http-client-reqwest", "rmcp/reqwest"]
http-native-tls = ["client", "rmcp/transport-streamable-http-client-reqwest", "rmcp/reqwest-native-tls"]
server = ["rmcp/server"]
server-stdio = ["server", "rmcp/transport-io"]
auth = ["rmcp/auth"]

[dependencies]
async-trait.workspace = true
openai-rs-types = { path = "../openai-rs-types", version = "=0.1.0", default-features = false, features = ["structured-output"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-core = { version = "0.1.36", default-features = false }

[lints]
workspace = true
