[workspace]
members = [
    "crates/openai-rs",
    "crates/openai-rs-types",
    "crates/openai-rs-client",
    "crates/openai-rs-codex",
    "crates/openai-rs-rmcp",
    "crates/openai-rs-contract-tests",
    "xtask",
]
exclude = [
    "fuzz",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnlangA/openai-rs"
homepage = "https://github.com/AnlangA/openai-rs"
keywords = ["openai", "api", "responses", "mcp", "async"]
categories = ["api-bindings", "web-programming::http-client"]

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.10.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
http = "1.3.1"
http-body-util = "0.1.3"
hmac = "0.12.1"
hyper = "1.7.0"
hyper-util = "0.1.16"
pin-project-lite = "0.2.16"
proptest = "1.7.0"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "http2", "json", "multipart", "stream"] }
rmcp = { version = "=3.1.4", default-features = false }
schemars = { version = "1.0.4", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order", "raw_value"] }
serde_path_to_error = "0.1.17"
sha2 = "0.10.9"
static_assertions = "1.1.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
toml = "0.8.20"
tokio-stream = "0.1.17"
tower = "0.5.2"
trybuild = "1.0.110"
url = { version = "2.5.7", features = ["serde"] }
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
